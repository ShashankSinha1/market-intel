services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
  ingest:
    build: .
    command: ["python", "src/ingest.py"]
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /app/src
        - action: rebuild
          path: ./requirements.txt
  processor:
    build: .
    command: ["python", "src/processor.py"]
    environment:
      - REDIS_URL=redis://redis:6379
      - MONGO_URL=mongodb://mongo:27017
    depends_on:
      - redis
      - mongo
    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /app/src
        - action: rebuild
          path: ./requirements.txt
  dashboard:
    build: .
    command: ["uvicorn", "src.dashboard:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports: ["8000:8000"]
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: rebuild
          path: ./requirements.txt